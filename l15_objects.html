<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objects — l15</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@200;300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --yellow: #F5EDD6; --yellow-mid: #E2CFA0; --yellow-dk: #C9AA6A;
  --red: #7A2509; --red-mid: #B03A18;
  --charcoal: #2A2720; --offwhite: #F8F5EF; --muted: #8A8070; --page-bg: #EDE8DC;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--page-bg); font-family: 'Work Sans', sans-serif; color: var(--charcoal); min-height: 100vh; }

.site-header { position: sticky; top: 0; z-index: 100; background: var(--offwhite); border-bottom: 3px solid var(--red); padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; }
.header-wm { font-family: 'Work Sans', sans-serif; font-weight: 200; font-size: 1.6rem; color: var(--charcoal); letter-spacing: 0.08em; text-decoration: none; }
.header-wm b { font-weight: 600; }
.header-back { font-family: 'Work Sans', sans-serif; font-size: 0.82rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); text-decoration: none; }
.header-back:hover { text-decoration: underline; }

.page-title-block { background: var(--offwhite); border-bottom: 1.5px solid var(--yellow-dk); padding: 40px 40px 32px; }
.page-eyebrow { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red); margin-bottom: 10px; }
.page-title { font-family: 'Work Sans', sans-serif; font-weight: 200; font-size: 2.6rem; color: var(--charcoal); letter-spacing: 0.04em; }
.page-title b { font-weight: 600; }

.objects-section { padding: 52px 40px; }
.objects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 1100px; margin: 0 auto; }

/* =============================================
   OBJECT CARD — copy this block to add an object
   ============================================= */
.object-card {
  background: var(--offwhite);
  border: 1.5px solid var(--charcoal);
  outline: 3px solid var(--offwhite);
  box-shadow: 0 0 0 5px var(--charcoal);
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow 0.2s;
}
.object-card:hover { box-shadow: 0 0 0 5px var(--red); }
.object-img { width: 100%; aspect-ratio: 1; overflow: hidden; background: var(--page-bg); }
.object-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.object-img.placeholder { display: flex; align-items: center; justify-content: center; }
.object-img.placeholder span { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
.object-info { padding: 18px 18px 14px; }
.object-num { font-size: 0.65rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.object-name { font-family: 'Work Sans', sans-serif; font-weight: 500; font-size: 1rem; color: var(--charcoal); margin-bottom: 4px; }
.object-material { font-family: 'Lora', serif; font-style: italic; font-size: 0.85rem; color: var(--muted); }

/* OVERLAY */
.overlay { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(42,39,32,0.85); align-items: center; justify-content: center; padding: 40px; }
.overlay.active { display: flex; }
.overlay-card { background: var(--offwhite); border: 1.5px solid var(--charcoal); outline: 3px solid var(--offwhite); box-shadow: 0 0 0 6px var(--charcoal); max-width: 700px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; position: relative; max-height: 85vh; overflow: hidden; }
.overlay-img { overflow: hidden; }
.overlay-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.overlay-content { padding: 32px; overflow-y: auto; }
.overlay-num { font-size: 0.65rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.overlay-name { font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 1.4rem; color: var(--charcoal); margin-bottom: 4px; }
.overlay-material { font-family: 'Lora', serif; font-style: italic; font-size: 0.9rem; color: var(--muted); margin-bottom: 18px; }
.overlay-divider { height: 1px; background: var(--red); margin-bottom: 16px; }
.overlay-desc { font-family: 'Lora', serif; font-size: 0.95rem; line-height: 1.7; color: var(--charcoal); }
.overlay-close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 1.4rem; color: var(--muted); cursor: pointer; z-index: 2; }
.overlay-close:hover { color: var(--charcoal); }

.footer { background: var(--charcoal); padding: 28px 40px; display: flex; align-items: center; justify-content: space-between; }
.footer-wm { font-family: 'Work Sans', sans-serif; font-weight: 200; font-size: 1.5rem; color: var(--yellow); letter-spacing: 0.08em; }
.footer-wm b { font-weight: 600; }
.footer-loc { font-family: 'Work Sans', sans-serif; font-size: 0.85rem; font-weight: 300; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

@media (max-width: 900px) { .objects-grid { grid-template-columns: repeat(2, 1fr); } .overlay-card { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .objects-grid { grid-template-columns: 1fr; } .objects-section { padding: 32px 24px; } .site-header, .page-title-block { padding-left: 24px; padding-right: 24px; } }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="header-wm">l<b>15</b></a>
  <a href="index.html" class="header-back">← back</a>
</header>

<div class="page-title-block">
  <div class="page-eyebrow">Collection</div>
  <div class="page-title"><b>Objects</b></div>
</div>

<section class="objects-section">
  <div class="objects-grid">

    <!-- =============================================
         COPY THIS BLOCK TO ADD AN OBJECT
         Change onclick number, add entry to JS array
         ============================================= -->
    <div class="object-card" onclick="openObject(0)">
      <div class="object-img">
        <img src="images/objects.png" alt="Watson pop-art">
      </div>
      <div class="object-info">
        <div class="object-num">001</div>
        <div class="object-name">[object name]</div>
        <div class="object-material">[material] — [year]</div>
      </div>
    </div>

    <div class="object-card" onclick="openObject(1)">
      <div class="object-img placeholder">
        <span>photo coming</span>
      </div>
      <div class="object-info">
        <div class="object-num">002</div>
        <div class="object-name">[object name]</div>
        <div class="object-material">[material] — [year]</div>
      </div>
    </div>

    <!-- ADD MORE OBJECTS HERE -->

  </div>
</section>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="overlay-card">
    <button class="overlay-close" onclick="closeObject()">×</button>
    <div class="overlay-img"><img id="ov-img" src="" alt=""></div>
    <div class="overlay-content">
      <div class="overlay-num" id="ov-num"></div>
      <div class="overlay-name" id="ov-name"></div>
      <div class="overlay-material" id="ov-material"></div>
      <div class="overlay-divider"></div>
      <div class="overlay-desc" id="ov-desc"></div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-wm">l<b>15</b></div>
  <div class="footer-loc">THE <span style="text-transform:none">l</span>15 WORKSHOP</div>
</footer>

<script>
// =============================================
// OBJECT ENTRIES
// Add an entry here for each object card above
// =============================================
const objects = [
  {
    num: "001",
    name: "[object name]",
    material: "[material] — [year]",
    img: "images/objects.png",
    desc: "[description of the object — what it is, how it was made, what it means]"
  },
  {
    num: "002",
    name: "[object name]",
    material: "[material] — [year]",
    img: "",
    desc: "[description]"
  }
];

function openObject(i) {
  const o = objects[i];
  document.getElementById('ov-num').textContent = o.num;
  document.getElementById('ov-name').textContent = o.name;
  document.getElementById('ov-material').textContent = o.material;
  document.getElementById('ov-desc').textContent = o.desc;
  const img = document.getElementById('ov-img');
  img.src = o.img || ''; img.style.display = o.img ? 'block' : 'none';
  document.getElementById('overlay').classList.add('active');
}
function closeObject() { document.getElementById('overlay').classList.remove('active'); }
function closeOverlay(e) { if (e.target === document.getElementById('overlay')) closeObject(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeObject(); });
</script>
</body>
</html>
