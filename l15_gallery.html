<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — l15</title>
<link rel="icon" type="image/svg+xml" href="images/l15.svg">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@200;300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --yellow: #F5EDD6; --yellow-mid: #E2CFA0; --yellow-dk: #C9AA6A;
  --red: #7A2509; --red-mid: #B03A18;
  --charcoal: #2A2720; --offwhite: #F8F5EF; --muted: #8A8070; --page-bg: #EDE8DC;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--charcoal); font-family: 'Work Sans', sans-serif; color: var(--yellow); min-height: 100vh; }

.site-header { position: sticky; top: 0; z-index: 100; background: var(--charcoal); border-bottom: 3px solid var(--red); padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; }
.header-wm { font-family: 'Work Sans', sans-serif; font-weight: 200; font-size: 1.6rem; color: var(--yellow); letter-spacing: 0.08em; text-decoration: none; }
.header-wm b { font-weight: 600; }
.header-back { font-family: 'Work Sans', sans-serif; font-size: 0.82rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red-mid); text-decoration: none; }
.header-back:hover { color: var(--yellow); }

.page-title-block { padding: 48px 40px 32px; border-bottom: 1px solid rgba(197,170,106,0.25); }
.page-eyebrow { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red-mid); margin-bottom: 10px; }
.page-title { font-family: 'Work Sans', sans-serif; font-weight: 200; font-size: 2.6rem; color: var(--yellow); letter-spacing: 0.04em; }

.gallery-section { padding: 48px 32px 80px; max-width: 1400px; margin: 0 auto; }
.masonry { columns: 4 240px; column-gap: 14px; }
.masonry img, .masonry video { width: 100%; display: block; margin-bottom: 14px; break-inside: avoid; cursor: pointer; border: 1px solid rgba(197,170,106,0.15); transition: opacity 0.2s; }
.masonry img:hover, .masonry video:hover { opacity: 0.85; }
.masonry .video-wrap { position: relative; margin-bottom: 14px; break-inside: avoid; }
.masonry .video-wrap video { margin-bottom: 0; }
.masonry .video-badge { position: absolute; top: 8px; right: 8px; background: rgba(42,39,32,0.75); color: var(--yellow); font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; pointer-events: none; }

.gallery-status { font-family: 'Lora', serif; font-style: italic; color: var(--muted); padding: 20px 0; text-align: center; }

/* LIGHTBOX */
.overlay { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.92); align-items: center; justify-content: center; padding: 20px; }
.overlay.active { display: flex; }
.overlay img, .overlay video { max-width: 92vw; max-height: 88vh; object-fit: contain; }
.overlay-close { position: absolute; top: 20px; right: 28px; background: none; border: none; font-size: 1.8rem; color: var(--muted); cursor: pointer; }
.overlay-close:hover { color: var(--yellow); }

.footer { background: var(--charcoal); border-top: 3px solid var(--red); padding: 28px 40px; display: flex; align-items: center; justify-content: space-between; }
.footer-wm { font-family: 'Work Sans', sans-serif; font-weight: 200; font-size: 1.5rem; color: var(--yellow); letter-spacing: 0.08em; }
.footer-wm b { font-weight: 600; }
.footer-loc { font-family: 'Work Sans', sans-serif; font-size: 0.85rem; font-weight: 300; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

@media (max-width: 768px) {
  .masonry { columns: 2 130px; column-gap: 10px; }
  .masonry img, .masonry video, .masonry .video-wrap { margin-bottom: 10px; }
  .site-header, .page-title-block, .gallery-section { padding-left: 20px; padding-right: 20px; }
  .gallery-section { padding-left: 14px; padding-right: 14px; }
  .page-title { font-size: 2rem; }
}
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="header-wm">l<b>15</b></a>
  <a href="index.html" class="header-back">← back</a>
</header>

<div class="page-title-block">
  <div class="page-eyebrow">Starred</div>
  <div class="page-title">Gallery</div>
</div>

<section class="gallery-section">
  <div class="masonry" id="masonry"></div>
  <div class="gallery-status" id="status">loading photos…</div>
</section>

<div class="overlay" id="overlay" onclick="closeImg(event)">
  <button class="overlay-close" onclick="closeImg()">×</button>
  <div id="ov-media"></div>
</div>

<footer class="footer">
  <div class="footer-wm">l<b>15</b></div>
  <div class="footer-loc">THE <span style="text-transform:none">l</span>15 WORKSHOP</div>
</footer>

<script>
// =======================================================
// GALLERY — auto-lists photos from the GitHub repo folder.
// Just upload/delete images in images/gallery/ on GitHub;
// this page reflects it automatically, no code editing.
// =======================================================
const REPO = "SarPres/l15";
const FOLDER = "images/Gallery";
const IMG_EXT = /\.(jpe?g|png|webp|gif)$/i;
const VIDEO_EXT = /\.(mp4|webm|mov|m4v)$/i;

async function loadGallery() {
  const statusEl = document.getElementById('status');
  const grid = document.getElementById('masonry');
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}`);
    if (!res.ok) throw new Error('fetch failed: ' + res.status);
    const files = await res.json();
    const media = files.filter(f => f.type === 'file' && (IMG_EXT.test(f.name) || VIDEO_EXT.test(f.name)));
    if (media.length === 0) {
      statusEl.textContent = 'Nothing here yet — add photos or video to images/gallery on GitHub.';
      return;
    }
    media.forEach(f => {
      const label = f.name.replace(IMG_EXT, '').replace(VIDEO_EXT, '').replace(/[-_]/g, ' ');
      if (VIDEO_EXT.test(f.name)) {
        const wrap = document.createElement('div');
        wrap.className = 'video-wrap';
        const vid = document.createElement('video');
        vid.src = f.download_url;
        vid.muted = true;
        vid.loop = true;
        vid.playsInline = true;
        vid.preload = 'metadata';
        vid.addEventListener('mouseenter', () => vid.play());
        vid.addEventListener('mouseleave', () => vid.pause());
        vid.onclick = () => openMedia(f.download_url, label, true);
        const badge = document.createElement('div');
        badge.className = 'video-badge';
        badge.textContent = 'video';
        wrap.appendChild(vid);
        wrap.appendChild(badge);
        grid.appendChild(wrap);
      } else {
        const img = document.createElement('img');
        img.src = f.download_url;
        img.alt = label;
        img.loading = 'lazy';
        img.onclick = () => openMedia(f.download_url, label, false);
        grid.appendChild(img);
      }
    });
    statusEl.remove();
  } catch (err) {
    statusEl.textContent = 'Couldn\'t load the gallery right now — check back shortly.';
    console.error(err);
  }
}

function openMedia(src, label, isVideo) {
  const holder = document.getElementById('ov-media');
  holder.innerHTML = '';
  if (isVideo) {
    const vid = document.createElement('video');
    vid.src = src;
    vid.controls = true;
    vid.autoplay = true;
    vid.loop = true;
    holder.appendChild(vid);
  } else {
    const img = document.createElement('img');
    img.src = src;
    img.alt = label;
    holder.appendChild(img);
  }
  document.getElementById('overlay').classList.add('active');
}
function closeImg(e) {
  if (!e || e.target.id === 'overlay' || e.target.classList.contains('overlay-close')) {
    document.getElementById('overlay').classList.remove('active');
    const holder = document.getElementById('ov-media');
    const v = holder.querySelector('video');
    if (v) v.pause();
    holder.innerHTML = '';
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeImg(); });

loadGallery();
</script>
</body>
</html>
