<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main Characters — l15</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@200;300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --yellow: #F5EDD6; --yellow-mid: #E2CFA0; --yellow-dk: #C9AA6A;
  --red: #7A2509; --red-mid: #B03A18;
  --charcoal: #2A2720; --offwhite: #F8F5EF; --muted: #8A8070; --page-bg: #EDE8DC;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--page-bg); font-family: 'Work Sans', sans-serif; color: var(--charcoal); min-height: 100vh; }
.site-header { position: sticky; top: 0; z-index: 100; background: var(--offwhite); border-bottom: 3px solid var(--red); padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; }
.header-wm { font-family: 'Work Sans', sans-serif; font-weight: 200; font-size: 1.6rem; color: var(--charcoal); letter-spacing: 0.08em; text-decoration: none; }
.header-wm b { font-weight: 600; }
.header-back { font-family: 'Work Sans', sans-serif; font-size: 0.82rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); text-decoration: none; }
.header-back:hover { text-decoration: underline; }
.page-title-block { background: var(--offwhite); border-bottom: 1.5px solid var(--yellow-dk); padding: 40px 40px 32px; }
.page-eyebrow { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red); margin-bottom: 10px; }
.page-title { font-family: 'Work Sans', sans-serif; font-weight: 200; font-size: 2.6rem; color: var(--charcoal); letter-spacing: 0.04em; }

.characters-section { padding: 60px 40px; max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; }

/* ═══════════════════════════════════════════════════
   CHARACTER CARD
   Copy this block to add a character.
   Photo: tall portrait crop works best.
   Text: two sentences — keep it delightful, keep it short.
   ═══════════════════════════════════════════════════ */
.char-card { background: var(--offwhite); border: 1.5px solid var(--charcoal); outline: 3px solid var(--offwhite); box-shadow: 0 0 0 5px var(--charcoal); overflow: hidden; }
.char-photo { width: 100%; aspect-ratio: 3/4; overflow: hidden; background: var(--page-bg); }
.char-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.char-photo.placeholder { display: flex; align-items: center; justify-content: center; }
.char-photo.placeholder span { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
.char-info { padding: 24px; border-top: 3px solid var(--red); }
.char-name { font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 1.2rem; color: var(--charcoal); margin-bottom: 4px; }
.char-role { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--red); margin-bottom: 12px; }
.char-bio { font-family: 'Lora', serif; font-size: 0.95rem; line-height: 1.65; color: var(--charcoal); }

.footer { background: var(--charcoal); padding: 28px 40px; display: flex; align-items: center; justify-content: space-between; }
.footer-wm { font-family: 'Work Sans', sans-serif; font-weight: 200; font-size: 1.5rem; color: var(--yellow); letter-spacing: 0.08em; }
.footer-wm b { font-weight: 600; }
.footer-loc { font-family: 'Work Sans', sans-serif; font-size: 0.85rem; font-weight: 300; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
@media (max-width: 700px) { .characters-section { grid-template-columns: 1fr; padding: 32px 20px; } .site-header, .page-title-block { padding-left: 20px; padding-right: 20px; } }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="header-wm">l<b>15</b></a>
  <a href="index.html" class="header-back">← back</a>
</header>

<div class="page-title-block">
  <div class="page-eyebrow">Cast</div>

</div>

<section class="characters-section">

  <!-- Watson — real content, photo in -->
  <div class="char-card">
    <div class="char-photo">
      <img src="images/watson_hero.jpg" alt="Watson">
    </div>
    <div class="char-info">
      <div class="char-name">Watson</div>
      <div class="char-role">The dog</div>
      <div class="char-bio">[two sentences — your words about Watson]</div>
    </div>
  </div>

  <div class="char-card">
    <div class="char-photo placeholder">
      <span>[photo]</span>
    </div>
    <div class="char-info">
      <div class="char-name">[name]</div>
      <div class="char-role">[role]</div>
      <div class="char-bio">[two sentences]</div>
    </div>
  </div>
  -->

</section>

<footer class="footer">
  <div class="footer-wm">l<b>15</b></div>
  <div class="footer-loc">THE <span style="text-transform:none">l</span>15 WORKSHOP</div>
</footer>

</body>
</html>
